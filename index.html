<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Инструменты для судовых манифестов</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main class="page">
    <div class="page__kicker">Судовые манифесты — набор инструментов</div>
    <h1 class="page__title">Инструменты для судовых манифестов</h1>
    <p class="page__subtitle">
      Выберите нужный инструмент — вся обработка идёт прямо в браузере, файлы никуда не отправляются.
    </p>
    <div class="tabs" role="tablist">
      <button type="button" class="tab tab--active" id="tab-export" role="tab" aria-selected="true" aria-controls="tool-grid-export">Экспорт</button>
      <button type="button" class="tab" id="tab-import" role="tab" aria-selected="false" aria-controls="tool-grid-import">Импорт</button>
    </div>
    <div class="tool-grid" id="tool-grid-export" role="tabpanel" aria-labelledby="tab-export"></div>
    <div class="tool-grid" id="tool-grid-import" role="tabpanel" aria-labelledby="tab-import" hidden></div>
  </main>

  <script src="tools.js?v=202609102152"></script>
  <script>
    (function renderTools() {
      var grids = {
        export: document.getElementById('tool-grid-export'),
        import: document.getElementById('tool-grid-import'),
      };
      var tabs = {
        export: document.getElementById('tab-export'),
        import: document.getElementById('tab-import'),
      };
      var tools = window.TOOLS || [];
      var byCategory = { export: [], import: [] };

      tools.forEach(function (tool) {
        (byCategory[tool.category] || byCategory.import).push(tool);
      });

      Object.keys(grids).forEach(function (category) {
        var grid = grids[category];
        var list = byCategory[category];

        if (!list.length) {
          var empty = document.createElement('p');
          empty.className = 'tool-empty';
          empty.textContent = 'Инструменты пока не добавлены.';
          grid.appendChild(empty);
          return;
        }

        list.forEach(function (tool) {
          var card = document.createElement('a');
          card.className = 'tool-card';
          card.href = tool.href;

          var title = document.createElement('h2');
          title.className = 'tool-card__title';
          title.textContent = tool.title;

          var description = document.createElement('p');
          description.className = 'tool-card__description';
          description.textContent = tool.description;

          card.appendChild(title);
          card.appendChild(description);
          grid.appendChild(card);
        });
      });

      function selectTab(category) {
        Object.keys(grids).forEach(function (key) {
          var isActive = key === category;
          grids[key].hidden = !isActive;
          tabs[key].classList.toggle('tab--active', isActive);
          tabs[key].setAttribute('aria-selected', String(isActive));
        });
      }

      tabs.export.addEventListener('click', function () {
        selectTab('export');
      });
      tabs.import.addEventListener('click', function () {
        selectTab('import');
      });
    })();
  </script>
</body>
</html>
