<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Инструменты для судовых манифестов</title>
  <link rel="stylesheet" href="assets/fonts.css?v=202609121900" />
  <link rel="stylesheet" href="assets/style.css?v=202609121616" />
</head>
<body class="app">
  <aside class="app__side" id="app-side"></aside>

  <main class="app__main">
    <h1 class="page__title">С чего начать</h1>
    <p class="page__subtitle">Слева все инструменты вкладки — они под рукой на любой странице.</p>

    <section class="home-panel" data-tab-panel="export" role="tabpanel" aria-labelledby="side-tab-export">
      <div class="route">
        <h2 class="route__title" id="route-title-export">Обычный порядок работы на экспорте</h2>
        <ol class="route__stops" id="route-export" aria-labelledby="route-title-export"></ol>
      </div>
      <div class="tool-cards" id="cards-export"></div>
    </section>

    <section class="home-panel" data-tab-panel="import" role="tabpanel" aria-labelledby="side-tab-import" hidden>
      <div class="route">
        <h2 class="route__title" id="route-title-import">Обычный порядок работы на импорте</h2>
        <ol class="route__stops" id="route-import" aria-labelledby="route-title-import"></ol>
      </div>
      <div class="tool-cards" id="cards-import"></div>
    </section>
  </main>

  <script src="tools.js?v=202609121900"></script>
  <script src="assets/shell.js?v=202609121930"></script>
  <script>
    // Маршрут и карточки главной — по window.TOOLS, в порядке записей tools.js
    // (другого места, где задан порядок, нет). Какая вкладка видна — решает
    // assets/shell.js по атрибуту data-tab-panel.
    (function renderHome() {
      var tools = window.TOOLS || [];

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      ['export', 'import'].forEach(function (category) {
        var route = document.getElementById('route-' + category);
        var cards = document.getElementById('cards-' + category);
        var list = tools.filter(function (tool) {
          return tool.category === category;
        });

        if (!list.length) {
          route.parentNode.hidden = true;
          cards.appendChild(el('p', 'tool-empty', 'Инструменты пока не добавлены.'));
          return;
        }

        route.style.setProperty('--stops', String(list.length));

        list.forEach(function (tool) {
          var stop = el('li', 'route__stop');
          var stopLink = el('a', 'route__link');
          stopLink.href = tool.href;
          stopLink.appendChild(el('span', 'route__name', tool.navTitle || tool.title));
          if (tool.output) stopLink.appendChild(el('span', 'fmt', tool.output));
          stop.appendChild(stopLink);
          route.appendChild(stop);

          var card = el('a', 'tool-card');
          card.href = tool.href;
          card.appendChild(el('h3', 'tool-card__title', tool.title));
          card.appendChild(el('p', 'tool-card__description', tool.description));
          if (tool.output) card.appendChild(el('span', 'fmt', tool.output));
          cards.appendChild(card);
        });
      });
    })();
  </script>
</body>
</html>
