<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пароль — Лоция</title>
<!-- Без входа /assets/style.css не отдаётся (401): палитра — /portal/theme.css, своё — /portal/portal.css -->
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/portal/theme.css">
<link rel="stylesheet" href="/portal/portal.css">
</head>
<body class="portal-public">
<main class="auth">
  <p class="auth__brand">Лоция<span class="portal-dot">.</span></p>
  <section class="auth__card">
    <h1 id="title">Новый пароль</h1>
    <p class="auth__lead" id="who" hidden></p>
    <form class="auth__form" id="password-form" novalidate hidden>
      <label class="field">Пароль
        <input type="password" id="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field">Ещё раз
        <input type="password" id="password2" autocomplete="new-password" minlength="8" required>
      </label>
      <p class="auth__hint">Не короче 8 символов.</p>
      <p class="portal-msg portal-msg--error" id="form-error" role="alert" hidden></p>
      <div>
        <button class="btn" type="submit" id="submit">Сохранить и войти</button>
      </div>
    </form>
    <p class="portal-msg portal-msg--error" id="gone" role="alert" hidden>Ссылка уже использована или устарела — попросите новую у администратора.</p>
  </section>
</main>
<script type="module">
// Одна страница на приглашение (/invite/<токен>) и сброс (/reset/<токен>); режим — по пути.
// После «Сохранить и войти» сервер сразу выдаёт сессию — переходим на главную.
import { api, ApiError, showMessage } from '/portal/portal.js';

const parts = location.pathname.split('/').filter(Boolean);
const mode = parts[0] === 'reset' ? 'reset' : 'invite';
const path = `/api/${mode}/${parts[1] || ''}`;

const title = document.getElementById('title');
const form = document.getElementById('password-form');
const error = document.getElementById('form-error');
const who = document.getElementById('who');
const gone = document.getElementById('gone');
const submit = document.getElementById('submit');

function showGone(text) {
  form.hidden = true;
  who.hidden = true;
  if (text) gone.textContent = text;
  gone.hidden = false;
}

try {
  const data = await api(path, { loginOn401: false });
  const name = (data.name || '').trim();
  const heading = mode === 'invite' && name ? `Добро пожаловать, ${name}` : mode === 'invite' ? 'Добро пожаловать' : 'Новый пароль';
  title.textContent = heading;
  document.title = `${heading} — Лоция`;
  who.textContent = data.email;
  who.hidden = false;
  form.hidden = false;
  document.getElementById('password').focus();
} catch (err) {
  showGone(err instanceof ApiError && err.status === 410 ? err.message : 'Не удалось проверить ссылку. Обновите страницу.');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  if (password.length < 8) return showMessage(error, 'Пароль — не короче 8 символов');
  if (password !== document.getElementById('password2').value) return showMessage(error, 'Пароли не совпадают');
  showMessage(error, '');
  submit.disabled = true;
  try {
    await api(path, { method: 'POST', body: { password }, loginOn401: false });
    location.href = '/';
  } catch (err) {
    if (err.status === 410) return showGone(err.message);
    submit.disabled = false;
    showMessage(error, err.message);
  }
});
</script>
</body>
</html>
