<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/portal/favicon.svg">
<title>Пользователи — Tallyman</title>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/portal/portal.css">
</head>
<body class="app portal-page">
<aside class="app__side" id="app-side"></aside>
<main class="app__main">
  <h1 class="page__title">Пользователи</h1>
  <ul class="portal-subnav" aria-label="Администрирование">
    <li><a href="/admin/users" aria-current="page">Пользователи</a></li>
    <li><a href="/admin/requests" id="subnav-requests">Запросы</a></li>
    <li><a href="/journal">Журнал всех</a></li>
  </ul>

  <div class="portal-actions">
    <button class="btn" type="button" id="invite-open" aria-expanded="false" aria-controls="invite-panel">Пригласить</button>
    <button class="btn btn--secondary" type="button" id="guest-open" aria-expanded="false" aria-controls="guest-panel">Тестовая ссылка</button>
  </div>

  <section class="portal-panel invite-panel" id="invite-panel" hidden>
    <h2>Пригласить</h2>
    <form class="portal-form portal-form--wide" id="invite-form" novalidate>
      <div class="field-grid invite-fields">
        <label class="field">Почта
          <input type="email" id="invite-email" autocomplete="off" required>
        </label>
        <label class="field">Имя
          <input type="text" id="invite-name" autocomplete="off" required>
        </label>
      </div>
      <div id="invite-tools"></div>
      <label class="tool-check users-setting-check">
        <input type="checkbox" id="invite-show-locked">
        <span>Показывать недоступные инструменты и разрешить запрашивать доступ</span>
      </label>
      <div class="portal-form__actions">
        <button class="btn" type="submit" id="invite-submit">Отправить приглашение</button>
        <button class="btn btn--secondary" type="button" id="invite-cancel">Отмена</button>
      </div>
      <p class="portal-msg" id="invite-msg" role="alert" hidden></p>
    </form>
    <div id="invite-result" hidden>
      <p id="invite-done"></p>
      <div id="invite-link"></div>
      <div class="portal-actions invite-again">
        <button class="btn btn--secondary" type="button" id="invite-again">Пригласить ещё</button>
      </div>
    </div>
  </section>

  <section class="portal-panel invite-panel" id="guest-panel" hidden>
    <h2>Тестовая ссылка</h2>
    <p class="portal-muted">Ссылка сразу открывает портал с выбранными инструментами — без почты и пароля, до конца срока.</p>
    <form class="portal-form portal-form--wide" id="guest-form" novalidate>
      <div class="field-grid invite-fields">
        <label class="field">Название
          <input type="text" id="guest-name" autocomplete="off" placeholder="Например, «Тест для ООО Ромашка»" required>
        </label>
        <label class="field">Срок, часов
          <input type="number" id="guest-hours" min="1" max="720" step="1" value="24" inputmode="numeric" required>
        </label>
      </div>
      <div id="guest-tools"></div>
      <label class="tool-check users-setting-check">
        <input type="checkbox" id="guest-show-locked">
        <span>Показывать недоступные инструменты</span>
      </label>
      <div class="portal-form__actions">
        <button class="btn" type="submit" id="guest-submit">Создать ссылку</button>
        <button class="btn btn--secondary" type="button" id="guest-cancel">Отмена</button>
      </div>
      <p class="portal-msg" id="guest-msg" role="alert" hidden></p>
    </form>
    <div id="guest-result" hidden>
      <p id="guest-done"></p>
      <div id="guest-link"></div>
      <div class="portal-actions invite-again">
        <button class="btn btn--secondary" type="button" id="guest-again">Ещё одна ссылка</button>
      </div>
    </div>
  </section>

  <p class="error-message" id="users-error" role="alert" hidden></p>

  <div class="table-scroll users-wrap">
    <table class="data-table users-table portal-stack">
      <thead>
        <tr>
          <th scope="col">Имя</th>
          <th scope="col">Почта</th>
          <th scope="col">Состояние</th>
          <th scope="col">Последний вход</th>
          <th scope="col"><span class="visually-hidden">Действия</span></th>
        </tr>
      </thead>
      <tbody id="users-rows"></tbody>
    </table>
  </div>
</main>
<script src="/tools.js"></script>
<script src="/assets/shell.js"></script>
<script type="module" src="/portal/admin-users.js"></script>
</body>
</html>
