<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/portal/favicon.png">
<title>Ссылка не действует — MukhLine</title>
<!-- Тема: без входа сервер её не ставит — берём последнюю тему этого браузера (её запоминают shell-addon.js и профиль) -->
<script>(function(){try{var r=document.documentElement,t=localStorage.getItem('manifest-tools:theme');if(!r.hasAttribute('data-theme')&&t&&/^[a-z]{1,20}$/.test(t))r.setAttribute('data-theme',t)}catch(e){}})()</script>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/portal/theme.css">
<link rel="stylesheet" href="/portal/portal.css">
</head>
<body class="portal-public">
<main class="auth">
  <p class="auth__brand"><img class="auth__logo" src="/portal/mukhline-logo.jpg" alt="MukhLine" width="200" height="200"></p>
  <section class="auth__card">
    <h1>Ссылка не действует</h1>
    <p class="auth__lead">Тестовая ссылка больше не действует — срок истёк или доступ отключён.</p>
  </section>
</main>
</body>
</html>
