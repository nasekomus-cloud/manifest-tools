<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<link rel="stylesheet" href="/portal/theme.css">
</head>
<body>
<main>
  <h1>Вход</h1>
  <form id="login-form">
    <label>Почта <input type="email" id="email" autocomplete="username" required></label>
    <label>Пароль <input type="password" id="password" autocomplete="current-password" required></label>
    <button type="submit">Войти</button>
    <p id="login-error" role="alert" hidden></p>
  </form>
</main>
<script src="/portal/safe-next.js"></script>
<script>
// Оформление страницы — в задаче 8; здесь только рабочая форма.
(function () {
  // next — только путь внутри сайта (см. safe-next.js)
  function nextUrl() {
    return window.safeNext(new URLSearchParams(location.search).get('next'), location.origin);
  }
  var form = document.getElementById('login-form');
  var error = document.getElementById('login-error');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.hidden = true;
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    }).then(function (r) {
      return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (r) {
      if (r.ok) { location.href = nextUrl(); return; }
      error.textContent = r.data.error || 'Не удалось войти';
      error.hidden = false;
    }).catch(function () {
      error.textContent = 'Нет связи с сервером';
      error.hidden = false;
    });
  });
})();
</script>
</body>
</html>
