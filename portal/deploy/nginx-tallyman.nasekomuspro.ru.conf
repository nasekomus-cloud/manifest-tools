# vhost портала tallyman.nasekomuspro.ru.
# Установка: заменить __PORT__ на порт из /etc/manifest-portal.env, например
#   sed 's/__PORT__/8010/' nginx-tallyman.nasekomuspro.ru.conf \
#     > /etc/nginx/sites-available/tallyman.nasekomuspro.ru
#   ln -s ../sites-available/tallyman.nasekomuspro.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d tallyman.nasekomuspro.ru
# certbot сам добавит listen 443 и перенаправление с 80. default_server здесь
# нарочно нет: на сервере живут и другие сайты (em, disp, netbird).
server {
    listen 80;
    listen [::]:80;
    server_name tallyman.nasekomuspro.ru;

    # файлы манифестов на сервер не идут, только вход, журнал и страницы
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # перезаписываем, а не дописываем: приложение берёт по нему ограничение попыток входа
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
